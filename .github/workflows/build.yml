name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f sliding-puzzle-source.zip ]; then
            unzip -q -o sliding-puzzle-source.zip
          elif [ -f sliding-puzzle-fixed.zip ]; then
            unzip -q -o sliding-puzzle-fixed.zip
          fi

          if [ -d sliding-puzzle ]; then
            cp -a sliding-puzzle/. .
          fi

          test -f package.json
          test -f capacitor.config.ts
          test -d android
          test -f android/gradlew

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Assets
        run: |
          set -euxo pipefail
          bun run build:android:web
          test -f .output/public/index.html

      - name: Sync Capacitor
        run: |
          set -euxo pipefail
          chmod +x android/gradlew
          bunx cap sync android

      - name: Configure Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"

          test -s "$RUNNER_TEMP/release-key.jks"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release-key.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify Android SDK
        run: |
          set -euxo pipefail
          test -d "$ANDROID_HOME"

      - name: Build Release APK
        run: |
          set -euxo pipefail
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK Signature
        run: |
          set -euxo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: sliding-puzzle-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
