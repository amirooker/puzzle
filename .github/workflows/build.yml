name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract zip and prepare files
        run: |
          if [ -f sliding-puzzle-fixed.zip ]; then
            unzip -q -o sliding-puzzle-fixed.zip
          fi
          if [ -d artifacts/sliding-puzzle ]; then
            cp -r artifacts/sliding-puzzle/* .
            cp -r artifacts/sliding-puzzle/.* . 2>/dev/null || true
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install -g pnpm
          pnpm install --no-frozen-lockfile

      - name: Build Web Assets
        run: |
          pnpm run build:android:web
          mkdir -p .output
          cp -r dist/client .output/public

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sliding-puzzle-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
