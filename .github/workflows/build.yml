name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          unzip -q -o sliding-puzzle-fixed.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install and Build Web Assets
        working-directory: artifacts/sliding-puzzle
        run: |
          npm install -g pnpm
          pnpm install --no-frozen-lockfile
          pnpm run build:android:web
          mkdir -p .output
          cp -r dist/client .output/public
          npx cap sync android

      - name: Build Android APK
        working-directory: artifacts/sliding-puzzle/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sliding-puzzle-apk
          path: artifacts/sliding-puzzle/android/app/build/outputs/apk/debug/app-debug.apk
